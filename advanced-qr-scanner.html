<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>QR Scanner Pro - Gallery Only</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00f2fe;
            --accent: #4facfe;
            --secondary: #00d9ff;
            --danger: #ff4d6d;
            --success: #06ffa5;
            --bg: #0f172a;
            --bg-light: #1a1f3a;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-hover: rgba(255, 255, 255, 0.12);
            --text: #ffffff;
            --text-muted: #a0aec0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #0a0f1f 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 242, 254, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(79, 172, 254, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(0, 242, 254, 0.2);
            border-radius: 28px;
            padding: 50px 28px;
            text-align: center;
            box-shadow: 
                0 20px 60px -15px rgba(0, 0, 0, 0.6),
                inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            margin-bottom: 35px;
        }

        header h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.8px;
            text-transform: uppercase;
            tracking: 0.05em;
        }

        header p {
            font-size: 13px;
            opacity: 0.65;
            margin: 0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .upload-zone {
            border: 2px dashed rgba(0, 242, 254, 0.35);
            border-radius: 22px;
            padding: 45px 25px;
            margin-bottom: 28px;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.05) 0%, rgba(79, 172, 254, 0.03) 100%);
            position: relative;
            overflow: hidden;
        }

        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(0, 242, 254, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .upload-zone:hover {
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.12) 0%, rgba(79, 172, 254, 0.08) 100%);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px -10px rgba(0, 242, 254, 0.3);
        }

        .upload-zone:hover::before {
            opacity: 1;
        }

        .icon-box {
            font-size: 48px;
            margin-bottom: 18px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .upload-zone p {
            margin: 8px 0;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
        }

        .upload-zone p:last-child {
            font-size: 12px;
            opacity: 0.55;
            color: var(--text-muted);
        }

        .button-group {
            display: grid;
            gap: 12px;
        }

        .btn-gallery {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            color: #0f172a;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 12px 24px -8px rgba(0, 242, 254, 0.4);
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-gallery::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.5s ease;
            z-index: -1;
        }

        .btn-gallery:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px -10px rgba(0, 242, 254, 0.5);
        }

        .btn-gallery:hover::before {
            left: 100%;
        }

        .btn-gallery:active {
            transform: scale(0.97);
        }

        .btn-copy {
            background: linear-gradient(135deg, var(--success) 0%, #00d97a 100%);
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            color: #0f172a;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 20px -8px rgba(6, 255, 165, 0.35);
            letter-spacing: 0.5px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-copy.active {
            display: flex;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -10px rgba(6, 255, 165, 0.45);
        }

        .btn-copy:active {
            transform: scale(0.96);
        }

        .copy-icon {
            font-size: 16px;
        }

        #result-status {
            margin-top: 28px;
            font-size: 13px;
            min-height: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: var(--glass-hover);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.35s ease;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
        }

        #result-status.success {
            background: rgba(6, 255, 165, 0.1);
            border-color: rgba(6, 255, 165, 0.3);
            color: var(--success);
        }

        #result-status.error {
            background: rgba(255, 77, 109, 0.1);
            border-color: rgba(255, 77, 109, 0.3);
            color: var(--danger);
        }

        #result-status.info {
            background: rgba(0, 242, 254, 0.1);
            border-color: rgba(0, 242, 254, 0.3);
            color: var(--primary);
        }

        .copy-feedback {
            position: fixed;
            top: 30px;
            right: 30px;
            background: linear-gradient(135deg, var(--success) 0%, #00d97a 100%);
            color: #0f172a;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 12px 24px -8px rgba(6, 255, 165, 0.4);
            animation: slideInRight 0.4s ease, slideOutRight 0.4s ease 2.6s forwards;
            z-index: 1000;
            letter-spacing: 0.5px;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        #reader {
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 40px 20px;
                border-radius: 24px;
            }

            header h1 {
                font-size: 24px;
            }

            .upload-zone {
                padding: 35px 20px;
                margin-bottom: 24px;
            }

            .icon-box {
                font-size: 42px;
            }

            .copy-feedback {
                right: 16px;
                left: 16px;
                top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>QR Scanner Pro</h1>
            <p>Pemindai Galeri Presisi Tinggi</p>
        </header>

        <div class="upload-zone" id="drop-area">
            <div class="icon-box">📱</div>
            <p>Ketuk untuk memilih foto QR</p>
            <p>Mendukung format JPG, PNG, WEBP</p>
        </div>

        <input type="file" id="qr-input-file" accept="image/*">
        
        <div class="button-group">
           <button id="btn-trigger" class="btn-gallery">📂 Buka Galeri</button>
           <button id="btn-copy" class="btn-copy">
        <i class="fa-regular fa-copy"></i> <span>Salin Hasil</span>
    </button>
        </div>

        <div id="result-status" class="info">Silakan pilih gambar dari galeri</div>
        
        <div id="reader"></div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        const fileInput = document.getElementById('qr-input-file');
        const triggerBtn = document.getElementById('btn-trigger');
        const copyBtn = document.getElementById('btn-copy');
        const dropArea = document.getElementById('drop-area');
        const statusDisplay = document.getElementById('result-status');
        
        const html5QrCode = new Html5Qrcode("reader");
        
        let currentResult = null;

        const handleSuccess = (decodedText) => {
            currentResult = decodedText;
            statusDisplay.classList.remove('info', 'error');
            statusDisplay.classList.add('success');
            
            try {
                const url = new URL(decodedText);
                statusDisplay.innerText = "✓ QR Terdeteksi! URL Valid - Mengalihkan...";
                copyBtn.classList.remove('active');
                
                setTimeout(() => {
                    window.location.href = url.href;
                }, 1500);
            } catch (e) {
                // Bukan URL, tampilkan sebagai text
                statusDisplay.innerText = `✓ Text: ${decodedText}`;
                copyBtn.classList.add('active');
            }
        };

        const processFile = (file) => {
            if (!file) return;

            statusDisplay.classList.remove('success', 'error');
            statusDisplay.classList.add('info');
            statusDisplay.innerText = "⏳ Memproses gambar...";
            copyBtn.classList.remove('active');

            html5QrCode.scanFile(file, true)
                .then(decodedText => {
                    handleSuccess(decodedText);
                })
                .catch(err => {
                    statusDisplay.classList.remove('info');
                    statusDisplay.classList.add('error');
                    statusDisplay.innerText = "✗ Gagal mendeteksi QR. Pastikan gambar tajam dan jelas.";
                    copyBtn.classList.remove('active');
                });
        };

        const showCopyFeedback = () => {
            const feedback = document.createElement('div');
            feedback.className = 'copy-feedback';
            feedback.textContent = '✓ Teks disalin ke clipboard';
            document.body.appendChild(feedback);
            
            setTimeout(() => {
                feedback.remove();
            }, 3000);
        };

        triggerBtn.addEventListener('click', () => {
            fileInput.click();
        });

        dropArea.addEventListener('click', () => {
            fileInput.click();
        });

        copyBtn.addEventListener('click', () => {
            if (currentResult) {
                navigator.clipboard.writeText(currentResult).then(() => {
                    showCopyFeedback();
                }).catch(() => {
                    alert('Gagal menyalin ke clipboard');
                });
            }
        });

        fileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            processFile(file);
        });
    </script>
</body>
</html>
